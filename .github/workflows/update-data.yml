name: update-data

on:
  workflow_dispatch:
  schedule:
    # Primary attempt after the daily FX publication, plus a fallback in case
    # GitHub delays or drops the first scheduled event. The freshness check
    # below prevents both attempts from creating separate daily updates.
    - cron: "17 23 * * *"
    - cron: "43 04 * * *"
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: quarto-dev/quarto-actions/setup@v2

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::jsonlite
            any::yaml
            any::cli
            any::highcharter
            any::scales
            github::jbkunst/bcchr

      - name: Check whether scheduled data are stale
        id: freshness
        if: github.event_name == 'schedule'
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from datetime import datetime, timedelta, timezone

          stale = True
          try:
              with open("api/v1/manifest.json", encoding="utf-8") as manifest_file:
                  updated_at = json.load(manifest_file)["updated_at"]
              updated = datetime.fromisoformat(updated_at.replace("Z", "+00:00"))
              age = datetime.now(timezone.utc) - updated
              stale = age >= timedelta(hours=20)
              print(f"Published data age: {age}")
          except (OSError, KeyError, TypeError, ValueError) as error:
              print(f"Could not determine data freshness; update will run: {error}")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"stale={str(stale).lower()}\n")
          PY

      - name: Update data from BCCh
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'schedule' && steps.freshness.outputs.stale == 'true')
        env:
          BCCH_TOKEN: ${{ secrets.BCCH_TOKEN }}
        run: Rscript scripts/update_data.R

      - name: Validate static API
        run: python scripts/check_api.py

      - name: Render dashboard from local JSON
        run: quarto render dashboard/index.qmd --output-dir ../_site

      - name: Assemble Pages artifact
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p _site/api
          cp -R api/v1 _site/api/v1

      - name: Commit updated JSON
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'schedule' && steps.freshness.outputs.stale == 'true')
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add api/v1
          git diff --cached --quiet || git commit -m "chore(data): update BCCh series"
          git push

      - uses: actions/configure-pages@v5
        if: github.event_name != 'pull_request'

      - uses: actions/upload-pages-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
